name: Release

# Publish to PyPI on version tags, e.g. v0.1.0.
# The tag IS the version: hatch-vcs derives it from `git describe`, so nothing
# in the repo declares one. `pixi run smoke` fails the job unless the wheel's
# version equals the pushed tag, so a mismatch never reaches PyPI.
# audiotensor is NOT on PyPI yet: before pushing the first tag (v0.1.0),
# register this repo as a PENDING trusted publisher at
# https://pypi.org/manage/account/publishing/
# (project name audiotensor, owner yoyolicoris, repository audiotensor,
# workflow release.yml, environment pypi). The first publish then creates the
# project. The GitHub environment `pypi` is created automatically on first use;
# add protection rules (e.g. required reviewers) in the repo settings if wanted.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          locked: true
      - run: pixi run lint
      - run: pixi run format-check
      - run: pixi run test
      - run: pixi run build
      - run: pixi run smoke
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
