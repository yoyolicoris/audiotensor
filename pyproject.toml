[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "audiotensor"
dynamic = ["version"]
description = "A torch.Tensor subclass that tracks the hop length of frame-based audio features."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chin-Yun Yu", email = "chin-yun.yu@qmul.ac.uk" }]
maintainers = [{ name = "Chin-Yun Yu", email = "chin-yun.yu@qmul.ac.uk" }]
keywords = ["audio", "pytorch", "tensor-subclass", "hop-length", "resampling"]
# No 3.14: philtorch publishes no cp314 wheels yet.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
# torch>=2.4 is audiotensor's own floor (torch.serialization.add_safe_globals).
# Do not copy philtorch's torch pin here: its compiled wheels pin the torch
# minor they were built for, and the resolver applies that through philtorch.
dependencies = ["torch>=2.4", "numpy>=2", "philtorch>=0.7.0"]

[project.urls]
Homepage = "https://github.com/yoyolicoris/audiotensor"
Repository = "https://github.com/yoyolicoris/audiotensor"

# The git tag is the single source of truth for the version: `git tag v0.1.0`,
# and hatch-vcs derives it at build time (needs full history, incl. tags).
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/audiotensor"]

[tool.hatch.build.targets.sdist]
include = ["src/audiotensor", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.coverage.run]
source_pkgs = ["audiotensor"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

# ---------------------------------------------------------------------------
# pixi (development environments)
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
# linux-64 only: philtorch's macOS wheel needs PyPI torch's libomp and aborts
# next to conda-forge's pytorch-cpu.
platforms = ["linux-64"]

# conda-forge builds of [project.dependencies]; pixi maps them to their PyPI
# names, so only philtorch comes from PyPI. Python comes from requires-python
# plus the per-interpreter features below.
[tool.pixi.dependencies]
# narrower than [project.dependencies]: philtorch 0.7 pins torch==2.14.*
pytorch-cpu = ">=2.14,<3"
numpy = ">=2"

[tool.pixi.pypi-dependencies]
audiotensor = { path = ".", editable = true }

# Split from `dev` so the per-Python environments below carry only the test
# runner, not the tooling.
[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
python-build = "*"

# One feature per supported interpreter, so CI can run the suite across the
# whole `requires-python` range instead of whatever the solver happens to pick.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = ["py313", "test", "dev"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]

[tool.pixi.tasks]
test = { cmd = "pytest -v --cov --cov-branch --cov-report=term-missing --cov-report=xml", description = "Run the test suite, enforce full coverage, and write coverage.xml" }
lint = { cmd = "ruff check src tests scripts", description = "Lint with ruff" }
format = { cmd = "ruff format src tests scripts", description = "Format with ruff" }
format-check = { cmd = "ruff format --check src tests scripts", description = "Fail if any file needs reformatting" }
build = { cmd = "python -m build", description = "Build sdist and wheel" }
smoke = { cmd = "python scripts/smoke_wheel.py", description = "Install the built wheel in a clean venv and check its version and behaviour" }
